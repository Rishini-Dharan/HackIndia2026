name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and smoke-test parser
        working-directory: telemetry-ingestion
        run: |
          javac TelemetryIngestion.java
          out=$(printf '1|45.33.12.99|192.168.1.10|TCP|445|60000|PSH\nbad|line\n' | java TelemetryIngestion)
          echo "$out"
          test "$out" = '{"ts":"1","src_ip":"45.33.12.99","dst_ip":"192.168.1.10","protocol":"TCP","port":445,"bytes":60000,"flags":"PSH"}'
          java TelemetryIngestion --bench 500000

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
