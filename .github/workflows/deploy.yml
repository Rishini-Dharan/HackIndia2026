name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies 🔧
        run: |
          cd frontend
          npm ci

      - name: Build 🏗️
        run: |
          cd frontend
          npm run build
        env:
          # Set this repository variable to a hosted backend (wss://.../ws/chat) to make the
          # live demo use it; without it the demo falls back to the browser sandbox.
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
