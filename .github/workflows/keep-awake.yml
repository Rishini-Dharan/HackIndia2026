name: Keep backend awake

# Render's free tier sleeps after 15 idle minutes, so first visitors to the
# live demo would wait up to a minute. A ping every 10 minutes keeps it warm.
# One always-on free service fits in Render's 750 free hours per month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://qguardian-os-backend.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "backend did not answer"; exit 1
